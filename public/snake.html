<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snakewar</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sw-theme')||'system'}catch(e){document.documentElement.dataset.theme='system'}</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="snake.css">
</head>
<body class="snake-page">
<canvas id="field"></canvas>

<div id="hud" class="sw-panel">
  <div class="sw-title"><a href="/" title="Back to game select">‹</a> SNAKEWAR <span id="roomName"></span></div>
  <div id="players"></div>
  <button id="startBtn" class="hidden">Start round</button>
  <div id="status"></div>
</div>

<div id="chatBox" class="sw-panel">
  <div id="log"></div>
  <input id="chat" placeholder="Enter to chat · Esc to play" maxlength="200" autocomplete="off">
</div>

<div id="corner">
  <label id="themeBar">Theme
    <select id="theme">
      <option value="system">System</option>
      <option value="dark">Dark</option>
      <option value="light">Light</option>
    </select>
  </label>
  <details id="snakeHelp" class="sw-panel">
    <summary>How to play</summary>
    <p><b>Arrows / WASD</b> steer · <b>Space</b> start (host) · <b>Enter</b> chat</p>
    <p>Eat food to grow. Hitting a wall or any snake (yourself included) kills you, and your body
      breaks into food. Last snake alive wins the round.</p>
    <ul id="specialList"></ul>
  </details>
</div>
<script src="snakewar.js"></script>
</body>
</html>
